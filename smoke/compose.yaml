# Smoke test of the built images (smoke/run.sh): a fresh Postgres, ingest and the API.
services:
  postgres:
    image: docker.io/pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: smoke
      POSTGRES_DB: assistant
    healthcheck:
      test: [CMD, pg_isready, -U, assistant, -d, assistant]
      interval: 2s
      timeout: 5s
      retries: 30
  # Never paired: it only gets as far as WhatsApp's pairing QR
  ingest:
    image: ${INGEST_IMAGE:-alfred-ingest:smoke}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Rome
      PGHOST: postgres
      PGUSER: assistant
      PGPASSWORD: smoke
      PGDATABASE: assistant
    ports:
      - 127.0.0.1:18080:8080
    tmpfs:
      - /media
  api:
    image: ${API_IMAGE:-alfred-api:smoke}
    profiles: [api]
    environment:
      TZ: Europe/Rome
      PGHOST: postgres
      PGUSER: assistant_api
      PGPASSWORD: smoke
      PGDATABASE: assistant
      API_TOKEN: smoke-token-0123456789
      API_SCOPED_TOKENS: '{"hermes":{"token":"smoke-reader-0123456789","scopes":["archive.read"]}}'
    ports:
      - 127.0.0.1:18081:8080
    networks:
      - default
      - mcp-api
  mcp:
    image: ${MCP_IMAGE:-alfred-mcp:smoke}
    profiles: [api]
    depends_on:
      - api
    environment:
      ALFRED_API_URL: http://api:8080
      ALFRED_API_TOKEN: smoke-reader-0123456789
      MCP_TOKEN: smoke-mcp-client-0123456789
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    networks:
      - mcp-api
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15
networks:
  mcp-api:
    internal: true
