name: agent

# OpenCode (https://opencode.ai/docs/github/) with a model on OpenRouter (secret OPENROUTER_API_KEY). It works
# through the OpenCode GitHub App, whose pull requests start CI (unlike ones opened with GITHUB_TOKEN). Started by:
# - "/oc …" in a comment on an issue or pull request, by the owner or a collaborator
# - alert.yml, on a new ci-failure issue: it looks for the cause and opens a fix, which waits for a manual merge
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the ci-failure issue to fix
        required: true

permissions:
  id-token: write
  contents: read
  # gh in the agent's shell: the failed run's logs, and a comment when there is nothing to fix here
  actions: read
  issues: write

concurrency:
  group: agent-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@148842ef7cb1bc34192b3fff57d0f9721ab9c801 # v1.19.4
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: openrouter/z-ai/glm-5.3
          prompt: >-
            ${{ github.event_name == 'workflow_dispatch' && format('Issue #{0} reports a workflow of this
            repository failing outside pull requests. Read it with `gh issue view {0} --comments`, then the failed
            run with `gh run view <run id> --log-failed`, and find the cause. If it is in this repository or its
            dependencies (for instance WhatsApp changed and Baileys needs an update), fix it with the smallest
            change that does, following .github/copilot-instructions.md. Do not push or open a pull request
            yourself: one is opened from your changes and your final message, so end that message with the cause
            and "Fixes #{0}". If it is not (a GitHub, registry or network outage, a flaky run), change nothing and
            comment on the issue with what you found, using `gh issue comment {0}`.',
            inputs.issue) || '' }}
