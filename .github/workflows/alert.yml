name: alert

# The last job of image.yml and release.yml. Outside pull requests (the daily smoke test, main, a release tag) a
# failure opens an issue labeled "ci-failure", so it doesn't go unnoticed, and starts agent.yml on it; later failures
# comment on it, and the next successful run of the same kind closes it. On pull requests it does nothing (and
# passes, as the automerge of the agent's fixes wants every check passed).
# Called rather than started by workflow_run: runs started with GITHUB_TOKEN (image on a release tag, from
# release.yml; image and release on main, from automerge.yml) start no workflow_run.
on:
  workflow_call:
    inputs:
      failed:
        description: Whether a job of the calling run failed or was cancelled
        type: boolean
        required: true

jobs:
  alert:
    runs-on: ubuntu-latest
    concurrency:
      group: alert-${{ github.workflow }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NAME: ${{ github.workflow }}
      CONCLUSION: ${{ inputs.failed && 'failure' || 'success' }}
      EVENT: ${{ github.event_name }}
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          if [[ $EVENT == pull_request ]]; then echo 'a pull request: nothing to report'; exit 0; fi
          # Runs on a tag publish images: one issue for all of them, another for main
          if [[ $BRANCH == v* ]]; then where='release tags'; else where=$BRANCH; fi
          title="$NAME failing on $where"
          issue=$(gh issue list --label ci-failure --state open --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          run="[$NAME run]($URL) ($EVENT on \`$BRANCH\`, ${SHA:0:7}): $CONCLUSION"

          if [[ $CONCLUSION == success ]]; then
            if [[ -n $issue ]]; then gh issue close "$issue" --comment "Passing again: $run"; fi
          elif [[ -n $issue ]]; then
            gh issue comment "$issue" --body "Still failing: $run"
          else
            gh label create ci-failure --color B60205 --description 'A workflow failing outside pull requests' --force
            url=$(gh issue create --title "$title" --label ci-failure --body "$run

          The daily run on \`main\` is the smoke test against WhatsApp: a failure there with no change here usually means WhatsApp changed and Baileys needs an update.")
            # The agent looks for the cause and opens a fix
            gh workflow run agent.yml -f issue="${url##*/}"
          fi
