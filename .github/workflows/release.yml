name: release

# A merged pull request labeled "release" (Renovate labels updates of what goes into the images: runtime
# dependencies, base images, the lock file) ships as the next patch version: tag, GitHub release, then
# image.yml on that tag. Releases by hand (pushing a v* tag) work as before.
on:
  push:
    branches: [main]
  # automerge.yml merges with GITHUB_TOKEN, whose pushes start no workflow
  workflow_dispatch:
    inputs:
      sha:
        description: The merge commit to release (default the head of main)
        required: false

permissions:
  contents: write
  actions: write

# One at a time, so two merges in a row get two different versions
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - id: pr
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[] | select(.merged_at) | .labels[].name] | join(",")')
          echo "labels: ${labels:-none}"
          if [[ ",$labels," == *,release,* ]]; then echo "release=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pr.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - if: steps.pr.outputs.release == 'true'
        run: |
          if tag=$(git describe --tags --exact-match --match 'v*' "$SHA" 2>/dev/null); then
            echo "already released as $tag"
            exit 0
          fi
          last=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v$major.$minor.$((patch + 1))"
          echo "$last -> $next"
          gh release create "$next" --target "$SHA" --title "$next" --generate-notes --notes-start-tag "$last"
          gh workflow run image.yml --ref "$next"
