name: release

# Every push to main (or the commit given by hand) ships each service whose image inputs changed since that
# service's last release as its next patch version: tag <service>/vX.Y.Z, GitHub release, then image.yml on that tag. Releases by hand
# (pushing a <service>/v* tag) work as well.
on:
  push:
    branches: [main]
  # automerge.yml merges with GITHUB_TOKEN, whose pushes start no workflow
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to release (default the head of main)
        required: false

permissions:
  contents: write
  actions: write

# One at a time, so two merges in a row get two different versions
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: |
          # What goes into each image: its directory (Dockerfile included); the Node services also the
          # workspace's shared files, so a lock file or dependency update ships all three
          node='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|\.dockerignore)$'
          declare -A inputs=(
            [ingest]="^(ingest|db)/|$node"
            [api]="^(api|db)/|$node"
            [mcp]="^mcp/|$node"
            [hermes]='^hermes/'
            [transcriber]='^transcriber/'
          )
          for service in ingest api mcp hermes transcriber; do
            last=$(git tag -l "$service/v*.*.*" --sort=-v:refname | head -1)
            # shortcut: services without a tag of their own continue from the last shared vX.Y.Z (v0.9.20);
            # remove this fallback once every service has a <service>/v* tag
            last=${last:-$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)}
            # Compared with the last release, not the previous push: a run cancelled while queued (the concurrency
            # group keeps one pending run) loses nothing. A commit given by hand must come after that release.
            if ! git merge-base --is-ancestor "$last" "$SHA"; then echo "$service: $SHA does not follow $last"; continue; fi
            # Without rename detection, a file moved out of a service counts for that service too
            git diff --name-only --no-renames "$last" "$SHA" | grep -v '\.md$' | grep -qE "${inputs[$service]}" || continue
            IFS=. read -r major minor patch <<< "${last#*v}"
            next="$service/v$major.$minor.$((patch + 1))"
            echo "$last -> $next"
            gh release create "$next" --target "$SHA" --title "$service v$major.$minor.$((patch + 1))" \
              --generate-notes --notes-start-tag "$last"
            gh workflow run image.yml --ref "$next"
          done

  # A failure opens a ci-failure issue and a success closes it (alert.yml)
  alert:
    needs: release
    if: always()
    permissions:
      issues: write
      # to start agent.yml on a new issue
      actions: write
    uses: ./.github/workflows/alert.yml
    with:
      failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
