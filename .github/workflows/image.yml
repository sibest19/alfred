name: image

on:
  push:
    branches: [main]
    # One release line per service: api/v1.2.3 publishes ghcr.io/<owner>/<repo>-api:1.2.3
    tags: ['*/v*']
  pull_request:
  # release.yml starts it on the tags it creates (a tag pushed with GITHUB_TOKEN starts no workflow)
  workflow_dispatch:
  # Daily smoke test of main: WhatsApp can break the current Baileys without any change here
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # The built ingest and api images against a fresh Postgres and the real WhatsApp (smoke/run.sh)
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ingest/Dockerfile
          load: true
          tags: alfred-ingest:smoke
          cache-from: type=gha,scope=ingest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: alfred-api:smoke
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: mcp/Dockerfile
          load: true
          tags: alfred-mcp:smoke
          cache-from: type=gha,scope=mcp
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: hermes
          file: hermes/Dockerfile
          load: true
          tags: alfred-hermes:smoke
          cache-from: type=gha,scope=hermes
      - run: smoke/run.sh
      - run: API_IMAGE=alfred-api:smoke smoke/hermes/utf8.sh
      - run: hermes/check.sh

  # The transcriber image on the CPU (CI has no Intel GPU): the model loads and a spoken sentence comes back
  transcriber:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: transcriber
          file: transcriber/Dockerfile
          load: true
          tags: alfred-transcriber:smoke
          cache-from: type=gha,scope=transcriber
      # The model (about 1.2 GB), downloaded again only when app.py changes
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: smoke/models
          key: transcriber-model-${{ hashFiles('transcriber/app.py') }}
          restore-keys: transcriber-model-
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends espeak-ng
      - run: smoke/transcriber.sh

  # One image per service: ghcr.io/<owner>/<repo>-<service>, exact version tags only (the stack pins each)
  image:
    needs: [build, smoke, transcriber]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # On a release tag only the tagged service is built and pushed; the others pass as empty jobs
      SKIP: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, format('{0}/v', matrix.service)) }}
    strategy:
      matrix:
        include:
          - service: ingest
            dockerfile: ingest/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - service: api
            dockerfile: api/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - service: mcp
            dockerfile: mcp/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - service: hermes
            dockerfile: hermes/Dockerfile
            context: hermes
            platforms: linux/amd64,linux/arm64
          # the OpenVINO runtime has no ARM wheels
          - service: transcriber
            dockerfile: transcriber/Dockerfile
            context: transcriber
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.SKIP == 'false'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: env.SKIP == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: env.SKIP == 'false'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: env.SKIP == 'false' && startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: env.SKIP == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          # api/v1.2.3 -> 1.2.3
          tags: type=match,pattern=/v(\d+\.\d+\.\d+)$,group=1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: env.SKIP == 'false'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Outside pull requests, a failure opens a ci-failure issue and a success closes it (alert.yml)
  alert:
    needs: [build, smoke, transcriber, image]
    if: always()
    permissions:
      issues: write
      # to start agent.yml on a new issue
      actions: write
    uses: ./.github/workflows/alert.yml
    with:
      failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
