name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # release.yml starts it on the tag it creates (a tag pushed with GITHUB_TOKEN starts no workflow)
  workflow_dispatch:
  # Daily smoke test of main: WhatsApp can break the current Baileys without any change here
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # The built ingest and api images against a fresh Postgres and the real WhatsApp (smoke/run.sh)
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ingest/Dockerfile
          load: true
          tags: alfred-ingest:smoke
          cache-from: type=gha,scope=ingest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: alfred-api:smoke
          cache-from: type=gha,scope=api
      - run: smoke/run.sh

  # One image per service: ghcr.io/<owner>/<repo>-<service>, exact version tags only (the stack pins one)
  image:
    needs: [build, smoke]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: ingest
            dockerfile: ingest/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - service: api
            dockerfile: api/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          # the OpenVINO runtime has no ARM wheels
          - service: transcriber
            dockerfile: transcriber/Dockerfile
            context: transcriber
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          # v1.2.3 -> 1.2.3
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
